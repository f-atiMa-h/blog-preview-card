<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Blog Preview Card</title>

 
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-amber-300 text-gray-800 flex justify-center items-center min-h-screen">
  <!-- Main card -->
  <div class="bg-white rounded-xl overflow-hidden border border-black w-80 hover:shadow-lg p-5">
    <header>
      <img src="./assets/images/illustration-article.svg" alt="An Illustration" class="rounded-lg w-full">
    </header>
    <main class="mt-5">
      <span class="inline-block text-md font-bold tracking-tighter bg-amber-300 px-3 py-1 rounded-md mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">Learning</span>
      
      <p class="mb-3 font-semibold text-xs">Published 21 Dec 2023</p>
      <h2 class="uppercase font-extrabold text-lg mt-2">HTML & CSS Foundations</h2>
      <p class="text-base leading-relaxed max-w-prose mt-4">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      
      <div class="mt-4 flex items-center">
        <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" class="w-8 h-8 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p class="ml-2 font-bold text-sm">Greg Hooper</p>
      </div>
    </main>
    
    <footer class="mt-4 text-center text-xs ">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" class="text-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">Frontend Mentor</a>. 
      Coded by <a href="#" class="text-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500">Fatimah</a>.
    </footer>
  </div>
</body>
</html>
